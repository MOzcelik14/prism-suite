name: Release prisM. Suite

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: prism
            archive_ext: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: prism.exe
            archive_ext: zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libasound2-dev

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Compile release binary
        run: cargo build --release --locked --target ${{ matrix.target }}
        env:
          PRISM_PUBLIC_KEY: ${{ secrets.PRISM_PUBLIC_KEY }}

      - name: Package Linux release archive
        if: runner.os == 'Linux'
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PKG_NAME="prism-${VERSION}-linux-x86_64"
          mkdir -p "staging/${PKG_NAME}"
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" "staging/${PKG_NAME}/"
          cp README.md LICENSE "staging/${PKG_NAME}/"
          tar -czf "${PKG_NAME}.tar.gz" -C staging "${PKG_NAME}"
          mkdir -p artifacts
          mv "${PKG_NAME}.tar.gz" artifacts/

      - name: Package Windows release archive
        if: runner.os == 'Windows'
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PKG_NAME="prism-${VERSION}-windows-x86_64"
          mkdir -p "staging/${PKG_NAME}"
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" "staging/${PKG_NAME}/"
          cp README.md LICENSE "staging/${PKG_NAME}/"
          7z a -tzip "${PKG_NAME}.zip" "./staging/${PKG_NAME}"
          mkdir -p artifacts
          mv "${PKG_NAME}.zip" artifacts/

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}-archive
          path: artifacts/*
          if-no-files-found: error

  publish-release:
    name: Sign & Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          path: download

      - name: Prepare release directory & calculate checksums
        id: checksums
        run: |
          mkdir -p dist
          find download/ -type f \( -name "*.tar.gz" -o -name "*.zip" \) -exec cp {} dist/ \;
          cd dist
          sha256sum *.tar.gz *.zip > SHA256SUMS
          echo "Generated SHA256SUMS:"
          cat SHA256SUMS

      - name: Sign checksums with Minisign
        if: env.MINISIGN_KEY != ''
        env:
          MINISIGN_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PASSPHRASE: ${{ secrets.MINISIGN_PASSPHRASE }}
        run: |
          sudo apt-get update && sudo apt-get install -y minisign
          echo "$MINISIGN_KEY" > minisign.key
          cd dist
          if [ -n "$MINISIGN_PASSPHRASE" ]; then
            echo "$MINISIGN_PASSPHRASE" | minisign -S -s ../minisign.key -m SHA256SUMS -x SHA256SUMS.sig
          else
            minisign -S -s ../minisign.key -m SHA256SUMS -x SHA256SUMS.sig
          fi
          rm -f ../minisign.key

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
          generate_release_notes: true
          draft: false
          prerelease: false
