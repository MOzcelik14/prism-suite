name: Build & Release Multiplatform Packages

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: prism-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  rust-tests:
    name: Rust workspace tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libasound2-dev
      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Cargo registry and target directory
        uses: Swatinem/rust-cache@v2
      - name: Run Rust workspace tests
        run: cargo test --workspace --locked

  deb-appimage:
    name: Ubuntu build (deb, AppImage, tar.gz)
    needs: rust-tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - name: Install packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config build-essential libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libasound2-dev \
            curl file desktop-file-utils xvfb xauth libxcb-cursor0 libxkbcommon-x11-0 libegl1 mesa-utils ca-certificates python3
      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Cargo registry and target directory
        uses: Swatinem/rust-cache@v2
      - name: Build release binary
        run: cargo build --locked --release -p prism-app
      - name: Build Debian package
        run: bash scripts/package-linux.sh deb
      - name: Build AppImage
        run: bash scripts/package-linux.sh appimage
      - name: Build portable Linux tarball
        run: bash scripts/package-linux.sh tarball
      - name: Validate package outputs
        run: |
          test "$(find dist -name '*.deb' | wc -l)" -eq 1
          test "$(find dist -name '*.AppImage' | wc -l)" -eq 1
          test "$(find dist -name '*.tar.gz' | wc -l)" -eq 1
          dpkg-deb -f dist/*.deb Package Version Architecture
          test -x target/release/prism
      - uses: actions/upload-artifact@v5
        with:
          name: prism-ubuntu-packages
          path: |
            dist/*.deb
            dist/*.AppImage
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 30

  rpm:
    name: Fedora build (rpm)
    needs: rust-tests
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - name: Install native build and packaging tools
        run: |
          dnf install -y git gcc gcc-c++ make pkgconf-pkg-config alsa-lib-devel libxcb-devel libxkbcommon-devel rpm-build curl ca-certificates python3 rust cargo
      - uses: actions/checkout@v5
      - name: Build release binary on Fedora
        run: cargo build --locked --release -p prism-app
      - name: Package RPM
        run: bash scripts/package-linux.sh rpm
      - name: Validate RPM
        run: |
          test "$(find dist -name '*.rpm' | wc -l)" -eq 1
          rpm -qpl dist/*.rpm | grep -E '/usr/bin/prism$'
      - uses: actions/upload-artifact@v5
        with:
          name: prism-fedora-package
          path: dist/*.rpm
          if-no-files-found: error
          retention-days: 30

  windows:
    name: Windows build (zip MSVC)
    needs: rust-tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Cache Cargo registry and target directory
        uses: Swatinem/rust-cache@v2
      - name: Build Windows binary
        run: cargo build --locked --release -p prism-app
      - name: Package Windows ZIP
        shell: pwsh
        run: |
          $rawVer = "${{ github.ref_name }}"
          if ([string]::IsNullOrEmpty($rawVer) -or $rawVer -notlike "v*") {
            $ver = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' | ForEach-Object { $_.Matches[0].Groups[1].Value } | Select-Object -First 1)
          } else {
            $ver = $rawVer.TrimStart('v')
          }
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          $stage = Join-Path $env:TEMP "prism-stage"
          if (Test-Path $stage) { Remove-Item -Recurse -Force $stage }
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          Copy-Item -Path "target\release\prism.exe" -Destination $stage -Force
          Copy-Item -Path "assets" -Destination $stage -Recurse -Force
          Copy-Item -Path "README.md" -Destination $stage -Force
          Copy-Item -Path "LICENSE" -Destination $stage -Force
          Compress-Archive -Path "$stage\*" -DestinationPath "dist\prism-$ver-windows-x86_64.zip" -Force
          Remove-Item -Recurse -Force $stage
      - uses: actions/upload-artifact@v5
        with:
          name: prism-windows-package
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 30

  macos:
    name: macOS build (arm64 dmg + tar.gz)
    needs: rust-tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Cargo registry and target directory
        uses: Swatinem/rust-cache@v2
      - name: Build macOS binary
        run: cargo build --locked --release -p prism-app
      - name: Package macOS dmg and tar.gz
        run: |
          set -euo pipefail
          RAW_VER="${{ github.ref_name }}"
          if [[ -z "${RAW_VER}" || "${RAW_VER}" != v* ]]; then
            VER="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n1)"
          else
            VER="${RAW_VER#v}"
          fi
          mkdir -p dist

          # Portable tar.gz
          STAGE="$(mktemp -d)"
          PKG="${STAGE}/prism-${VER}-macos-arm64"
          mkdir -p "${PKG}"
          cp target/release/prism "${PKG}/prism"
          cp -r assets "${PKG}/assets"
          cp README.md LICENSE "${PKG}/"
          tar -C "${STAGE}" -czf "dist/prism-${VER}-macos-arm64.tar.gz" "prism-${VER}-macos-arm64"
          rm -rf "${STAGE}"

          # macOS .app bundle + .dmg
          DMG_STAGE="$(mktemp -d)"
          APP_DIR="${DMG_STAGE}/prisM. Suite.app"
          mkdir -p "${APP_DIR}/Contents/MacOS" "${APP_DIR}/Contents/Resources"
          cp target/release/prism "${APP_DIR}/Contents/MacOS/prism"
          chmod +x "${APP_DIR}/Contents/MacOS/prism"

          if [ -f assets/icons/prism_512x512.png ]; then
            ICONSET="$(mktemp -d)/prism.iconset"
            mkdir -p "${ICONSET}"
            sips -z 16 16     assets/icons/prism_512x512.png --out "${ICONSET}/icon_16x16.png" >/dev/null
            sips -z 32 32     assets/icons/prism_512x512.png --out "${ICONSET}/icon_16x16@2x.png" >/dev/null
            sips -z 32 32     assets/icons/prism_512x512.png --out "${ICONSET}/icon_32x32.png" >/dev/null
            sips -z 64 64     assets/icons/prism_512x512.png --out "${ICONSET}/icon_32x32@2x.png" >/dev/null
            sips -z 128 128   assets/icons/prism_512x512.png --out "${ICONSET}/icon_128x128.png" >/dev/null
            sips -z 256 256   assets/icons/prism_512x512.png --out "${ICONSET}/icon_128x128@2x.png" >/dev/null
            sips -z 256 256   assets/icons/prism_512x512.png --out "${ICONSET}/icon_256x256.png" >/dev/null
            sips -z 512 512   assets/icons/prism_512x512.png --out "${ICONSET}/icon_256x256@2x.png" >/dev/null
            sips -z 512 512   assets/icons/prism_512x512.png --out "${ICONSET}/icon_512x512.png" >/dev/null
            iconutil -c icns "${ICONSET}" -o "${APP_DIR}/Contents/Resources/prism.icns"
          fi

          cat > "${APP_DIR}/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key><string>prism</string>
            <key>CFBundleIdentifier</key><string>com.mozcelik14.prism-suite</string>
            <key>CFBundleName</key><string>prisM. Suite</string>
            <key>CFBundleVersion</key><string>${VER}</string>
            <key>CFBundleShortVersionString</key><string>${VER}</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleIconFile</key><string>prism</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          PLIST

          ln -s /Applications "${DMG_STAGE}/Applications"
          hdiutil create -volname "prisM. Suite ${VER}" -srcfolder "${DMG_STAGE}" -ov -format UDZO "dist/prism-${VER}-macos-arm64.dmg"
          rm -rf "${DMG_STAGE}"
      - uses: actions/upload-artifact@v5
        with:
          name: prism-macos-package
          path: |
            dist/*.dmg
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish GitHub Release
    needs: [deb-appimage, rpm, windows, macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          pattern: prism-*-package*
          merge-multiple: true
          path: dist
      - name: Verify package set and generate checksums
        shell: bash
        run: |
          set -euo pipefail
          test "$(find dist -maxdepth 1 -name '*.deb' | wc -l)" -eq 1
          test "$(find dist -maxdepth 1 -name '*.rpm' | wc -l)" -eq 1
          test "$(find dist -maxdepth 1 -name '*.AppImage' | wc -l)" -eq 1
          test "$(find dist -maxdepth 1 -name '*.dmg' | wc -l)" -eq 1
          test "$(find dist -maxdepth 1 -name '*.tar.gz' | wc -l)" -eq 2
          test "$(find dist -maxdepth 1 -name '*.zip' | wc -l)" -eq 1
          (cd dist && sha256sum -- *.deb *.rpm *.AppImage *.dmg *.tar.gz *.zip > SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt
      - name: Sign checksums with Minisign
        if: env.MINISIGN_KEY != ''
        env:
          MINISIGN_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PASSPHRASE: ${{ secrets.MINISIGN_PASSPHRASE }}
        run: |
          sudo apt-get update && sudo apt-get install -y minisign
          echo "$MINISIGN_KEY" > minisign.key
          cd dist
          if [ -n "$MINISIGN_PASSPHRASE" ]; then
            echo "$MINISIGN_PASSPHRASE" | minisign -S -s ../minisign.key -m SHA256SUMS.txt -x SHA256SUMS.sig
          else
            minisign -S -s ../minisign.key -m SHA256SUMS.txt -x SHA256SUMS.sig
          fi
          rm -f ../minisign.key
      - name: Create or update release with all packages
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.deb
            dist/*.rpm
            dist/*.AppImage
            dist/*.dmg
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS.txt
            dist/SHA256SUMS.sig
          fail_on_unmatched_files: false
          generate_release_notes: true
