[workspace]
resolver = "2"
members = [
    "crates/prism-app",
    "crates/prism-core",
    "crates/prism-net",
    "crates/prism-install",
    "crates/prism-i18n",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Murat Özçelik <mozcelik14@gmail.com>"]
license = "GPL-3.0-only"
repository = "https://github.com/MOzcelik14/prism-suite"

[workspace.dependencies]
prism-core = { path = "crates/prism-core" }
prism-net = { path = "crates/prism-net" }
prism-install = { path = "crates/prism-install" }
prism-i18n = { path = "crates/prism-i18n" }

eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow", "persistence"] }
egui = "0.29"
serde = { version = "1.0", features = ["derive"] }
ron = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
sha2 = "0.10"
ed25519-dalek = { version = "2.1", features = ["serde"] }
semver = { version = "1.0", features = ["serde"] }
zip = { version = "2.2", default-features = false, features = ["deflate"] }
tar = "0.4"
flate2 = "1.0"
directories = "5.0"
fluent-bundle = "0.15"
unic-langid = { version = "0.9", features = ["macros"] }
sys-locale = "0.3"
egui_commonmark = "0.18"
thiserror = "1.0"
crossbeam-channel = "0.5"
log = "0.4"
env_logger = "0.11"
chrono = { version = "0.4", features = ["serde"] }
