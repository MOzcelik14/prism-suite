<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#141B2E"/>
      <stop offset="1" stop-color="#070A14"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E8FBFF" stop-opacity="0.95"/>
      <stop offset="0.55" stop-color="#8FB8FF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#B58CFF" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#9ED8FF"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7FEFFF"/>
      <stop offset="1" stop-color="#18C8F0"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8CFFB0"/>
      <stop offset="1" stop-color="#22D96A"/>
    </linearGradient>
    <linearGradient id="magenta" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E7A0FF"/>
      <stop offset="1" stop-color="#C040F0"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- outgoing spectrum -->
  <g fill="none" stroke-linecap="round" stroke-width="13">
    <path d="M306 292 L470 250" stroke="url(#cyan)"/>
    <path d="M306 292 L474 306" stroke="url(#green)"/>
    <path d="M306 292 L470 362" stroke="url(#magenta)"/>
  </g>
  <!-- prism -->
  <path d="M230 112 L352 396 L108 396 Z" fill="url(#glass)" stroke="url(#edge)" stroke-width="9" stroke-linejoin="round"/>
  <path d="M230 112 L230 396" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="4"/>
  <path d="M230 112 L352 396 L230 396 Z" fill="#FFFFFF" fill-opacity="0.08"/>
  <!-- incoming white beam + internal refraction -->
  <path d="M38 312 L164 270" fill="none" stroke="#FFFFFF" stroke-width="13" stroke-linecap="round"/>
  <path d="M164 270 L306 292" fill="none" stroke="#FFFFFF" stroke-opacity="0.75" stroke-width="7" stroke-linecap="round"/>
  <!-- brand dot -->
  <circle cx="418" cy="428" r="13" fill="none" stroke="#E8FBFF" stroke-width="7"/>
</svg>
